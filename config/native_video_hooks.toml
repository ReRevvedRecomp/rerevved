# With native_video_scaler_stub, skip only the scaler import. Preserve the
# 800-byte copy and G+0x30 store; the remaining hooks only observe.

# sub_826B02B0 calls VdInitializeScalerCommandBuffer at 0x826B0430.
[[midasm_hook]]
address = 0x826B042C
name = "ReplaceNativeVideoScalerCall"
registers = ["r1", "r3", "r4", "r5", "r6", "r7", "r8", "r9", "r10", "r30", "r31"]
after_instruction = true
jump_address_on_true = 0x826B0434

[[midasm_hook]]
address = 0x826B0434
name = "ObserveNativeVideoScalerReturn"
registers = ["r1", "r3", "r30", "r31"]

[[midasm_hook]]
address = 0x826B044C
name = "ObserveNativeVideoScalerCopy"
registers = ["r1", "r30", "r31"]
after_instruction = true

# With native_video_display_mode_stub, skip only VdSetDisplayMode.
# Preserve the display-information call and device stores.

# Display owner: sub_826A61F0; import: 0x826A6260.
[[midasm_hook]]
address = 0x826A6260
name = "ReplaceNativeVideoDisplayModeCall"
registers = ["r1", "r3", "r31", "lr"]
after_instruction = false
jump_address_on_true = 0x826A6264

# Do not sample LR before reconvergence: skipping the call leaves it stale.
[[midasm_hook]]
address = 0x826A6264
name = "ObserveNativeVideoDisplayModeReturn"
registers = ["r1", "r3", "r5", "r31"]
after_instruction = false

[[midasm_hook]]
address = 0x826A626C
name = "ObserveNativeVideoDisplayModeReconverged"
registers = ["r1", "r3", "r5", "r31", "lr"]
after_instruction = false

