# Publish the conservative read-only title state once per guest frame.

[[midasm_hook]]
address = 0x82C7DF58
name = "ReRevvedPublishGameplayState"

# Ring-buffer initialization brackets the guest reset. Pause the host GPU while
# the guest resets the ring, then resume it before the next instruction.

[[midasm_hook]]
address = 0x8269CAE0
name = "ReRevvedCompatRingInitializeBegin"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269CAE4
name = "ReRevvedCompatRingInitializeEnd"

# Observe the title's device publication after the original indirect store.
# Native mode validates the stored value without changing guest state.

[[midasm_hook]]
address = 0x826A6460
name = "ReRevvedObserveNativeDevicePublication"
registers = ["r11", "r31"]

# Observe one statically proved renderer-texture backend store site. Native mode
# validates the completed store without retaining guest pointers or changing
# guest state. Runtime reachability remains unobserved.

[[midasm_hook]]
address = 0x82305104
name = "ReRevvedObserveNativeTexturePublication"
registers = ["r22", "r3"]

# Observe the resource-manager result immediately before its per-item dispatch.
# Native mode interprets explicit-buffer slots only after the vptr matches.

[[midasm_hook]]
address = 0x8250AE84
name = "ReRevvedObserveNativeResolveProviderIdentity"
registers = ["r3"]

# Observe each explicit-buffer factory store before the slot pointer advances.
# Native mode verifies the completed store and reads the container identity.

[[midasm_hook]]
address = 0x82518614
name = "ReRevvedObserveNativeExplicitBufferFactoryStore"
registers = ["r28", "r29", "r30", "r3"]

# Correlate D3DDevice_Resolve destinations with the later VdSwap source. These
# observers copy only the six fetch dwords and preserve both guest operations.

# The default-off passive trace brackets only the statically accepted producer
# path. Every hook returns to the original instruction stream.

[[midasm_hook]]
address = 0x8269C7A8
name = "ReRevvedTraceReservationEnter"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269C80C
name = "ReRevvedTraceReservationReturn"
registers = ["r3", "r29", "r31"]

[[midasm_hook]]
address = 0x826A4638
name = "ReRevvedTraceVdSwapOwnerEnter"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x826A4C0C
name = "ReRevvedTraceVdSwapOwnerReturn"
registers = ["r31"]

[[midasm_hook]]
address = 0x8269E520
name = "ReRevvedObserveRendererResolve"
registers = ["r4", "r6", "r8", "r9", "lr"]

[[midasm_hook]]
address = 0x8269F360
name = "ReRevvedTraceResolveReturn"

[[midasm_hook]]
address = 0x826A4884
name = "ReRevvedObserveRendererSwapSource"
registers = ["r3", "r4", "r30", "r31"]

[[midasm_hook]]
address = 0x826A4888
name = "ReRevvedTraceVdSwapReturn"
registers = ["r3", "r30", "r31"]

[[midasm_hook]]
address = 0x826A4890
name = "ReRevvedTraceVdSwapPublished"
registers = ["r30", "r31"]

[[midasm_hook]]
address = 0x826A4150
name = "ReRevvedTracePreSwapEnter"

[[midasm_hook]]
address = 0x826A4324
name = "ReRevvedTracePreSwapReturn"

[[midasm_hook]]
address = 0x8269CD20
name = "ReRevvedTraceEmitterCd20Enter"

[[midasm_hook]]
address = 0x8269CE78
name = "ReRevvedTraceEmitterCd20Return"

[[midasm_hook]]
address = 0x8269BF40
name = "ReRevvedTraceEmitterBf40Enter"

[[midasm_hook]]
address = 0x8269C12C
name = "ReRevvedTraceEmitterBf40Return"

[[midasm_hook]]
address = 0x826A3FB8
name = "ReRevvedTraceCallbackEnter"

[[midasm_hook]]
address = 0x826A4148
name = "ReRevvedTraceCallbackReturn"

[[midasm_hook]]
address = 0x826ABEA8
name = "ReRevvedTraceOrdinaryCallerEnter"

[[midasm_hook]]
address = 0x826AC018
name = "ReRevvedTraceOrdinaryCallerReturn"

[[midasm_hook]]
address = 0x82517E38
name = "ReRevvedTraceAlternateCallerEnter"

[[midasm_hook]]
address = 0x82517EB4
name = "ReRevvedTraceAlternateCallerReturn"

# Retain a failed render config until the same renderer supplies valid caps.

[[midasm_hook]]
address = 0x82245050
name = "ReRevvedRememberGfxRenderConfig"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x82302E90
name = "ReRevvedHandleGfxRenderCapsBegin"
registers = ["r3", "r4", "lr"]

[[midasm_hook]]
address = 0x82302F0C
name = "ReRevvedHandleGfxRenderCapsEnd"
registers = ["r3", "r31"]

# Fast combat selects the guest's native 0.5 presentation divisor only after
# setup selected an observed native 2.0 or 1.5 divisor.
[[midasm_hook]]
address = 0x82D7F934
name = "ReRevvedApplyCombatPaceOverride"

# Correct the active rush-cost divisor before the displayed and submitted cost
# returns, then coordinate the consumer before its production and treasury
# stores.

[[midasm_hook]]
address = 0x82CE2938
name = "ReRevvedFixRushCostDisplay"
registers = ["r27", "r30", "r31", "r6", "r7", "r11"]

[[midasm_hook]]
address = 0x82D17A9C
name = "ReRevvedFixRushCostApply"
registers = ["r25", "r26", "r28", "r3", "r6", "r8"]

# Compose Unique Unit base attack and defense before the native accessors apply
# their built-in unit and civilization modifiers.

[[midasm_hook]]
address = 0x82CF225C
name = "ReRevvedApplyUniqueUnitBaseAttack"
registers = ["r28", "r29", "r27"]

[[midasm_hook]]
address = 0x82CF21D8
name = "ReRevvedApplyUniqueUnitBaseDefense"
registers = ["r29", "r30", "r31"]

# Replace one unlocked UEA cell only in the shared cumulative lookup. Exact
# mode branches around this site and remains entirely native.

[[midasm_hook]]
address = 0x82CF0D6C
name = "ReRevvedApplyUniqueEraAbilityCell"
registers = ["r4", "r9", "r11"]

# The native Mongolian village-capture effect hard-codes civilization 14 and
# bypasses the shared UEA lookup. Re-evaluate its Ancient cell at that exact
# gate so a replacement uses the native ordinary-village reward branch.

[[midasm_hook]]
address = 0x82D1B758
name = "ReRevvedApplyBarbarianVillageCityReplacement"
registers = ["r10"]

# Retarget the unreachable retail UEA 57 technology-grant scaffold to the one
# title-owned synthetic ability. The surrounding native code retains selector
# 17 eligibility, cumulative lookup, ownership, and TechnologyAcquire behavior.

[[midasm_hook]]
address = 0x82D2127C
name = "ReRevvedBeginHorsebackRidingOwnershipCheck"
registers = ["r31"]

[[midasm_hook]]
address = 0x82D21280
name = "ReRevvedEndHorsebackRidingOwnershipCheck"
registers = ["r31"]

[[midasm_hook]]
address = 0x82D212A4
name = "ReRevvedSelectHorsebackRidingAbility"
registers = ["r3"]

[[midasm_hook]]
address = 0x82D212C0
name = "ReRevvedSelectHorsebackRidingTechnology"
registers = ["r4"]

# Reconcile only live same-player type-30 attachments after forced border
# relocation and the two verified successful post-combat movement returns.
# The repair changes only the General's tile coordinates.
[[midasm_hook]]
address = 0x82CBF534
name = "ReRevvedFixGreatGeneralBorderCompletion"

[[midasm_hook]]
address = 0x82CDFA64
name = "ReRevvedFixGreatGeneralPostCombat"
registers = ["r31", "r15"]

[[midasm_hook]]
address = 0x82CDFCC4
name = "ReRevvedFixGreatGeneralPostCombat"
registers = ["r31", "r26"]
