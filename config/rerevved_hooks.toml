# Publish the conservative read-only title state once per guest frame.

[[midasm_hook]]
address = 0x82C7DF58
name = "ReRevvedPublishGameplayState"

# Ring-buffer initialization brackets the guest reset. Pause the host GPU while
# the guest resets the ring, then resume it before the next instruction.

[[midasm_hook]]
address = 0x8269CAE0
name = "ReRevvedCompatRingInitializeBegin"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269CAE4
name = "ReRevvedCompatRingInitializeEnd"

# Retain a failed render config until the same renderer supplies valid caps.

[[midasm_hook]]
address = 0x82245050
name = "ReRevvedRememberGfxRenderConfig"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x82302E90
name = "ReRevvedHandleGfxRenderCapsBegin"
registers = ["r3", "r4", "lr"]

[[midasm_hook]]
address = 0x82302F0C
name = "ReRevvedHandleGfxRenderCapsEnd"
registers = ["r3", "r31"]

# Fast combat selects the guest's native 0.5 presentation divisor only after
# setup selected an observed native 2.0 or 1.5 divisor.
[[midasm_hook]]
address = 0x82D7F934
name = "ReRevvedApplyCombatPaceOverride"

# Correct the active rush-cost divisor before the displayed and submitted cost
# returns, then coordinate the consumer before its production and treasury
# stores.

[[midasm_hook]]
address = 0x82CE2938
name = "ReRevvedFixRushCostDisplay"
registers = ["r27", "r30", "r31", "r6", "r7", "r11"]

[[midasm_hook]]
address = 0x82D17A9C
name = "ReRevvedFixRushCostApply"
registers = ["r25", "r26", "r28", "r3", "r6", "r8"]
