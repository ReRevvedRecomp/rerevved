# Publish the conservative read-only title state once per guest frame.

# Replace the exact main-menu logo File Data payload after ResLoadByName and
# before the native output load. Invalid guest memory, allocation failure, and
# unmatched filenames preserve the original path.

[[midasm_hook]]
address = 0x82E87B90
name = "ApplyAssetFileOverride"
registers = ["r1", "r11", "r30"]

[[midasm_hook]]
address = 0x82C7DF58
name = "PublishGameplayState"

# Ring-buffer initialization brackets the guest reset. Pause the host GPU while
# the guest resets the ring, then resume it before the next instruction.

[[midasm_hook]]
address = 0x8269CAE0
name = "CompatRingInitializeBegin"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269CAE4
name = "CompatRingInitializeEnd"

# Observe the title's device publication after the original indirect store.
# Native mode validates the stored value without changing guest state.

[[midasm_hook]]
address = 0x826A6460
name = "ObserveNativeDevicePublication"
registers = ["r11", "r31"]

# Observe one statically proved renderer-texture backend store site. Native mode
# validates the completed store without retaining guest pointers or changing
# guest state. Runtime reachability remains unobserved.

[[midasm_hook]]
address = 0x82305104
name = "ObserveNativeTexturePublication"
registers = ["r22", "r3"]

# Observe the resource-manager result immediately before its per-item dispatch.
# Native mode interprets explicit-buffer slots only after the vptr matches.

[[midasm_hook]]
address = 0x8250AE84
name = "ObserveNativeResolveProviderIdentity"
registers = ["r3"]

# Observe each explicit-buffer factory store before the slot pointer advances.
# Native mode verifies the completed store and reads the container identity.

[[midasm_hook]]
address = 0x82518614
name = "ObserveNativeExplicitBufferFactoryStore"
registers = ["r28", "r29", "r30", "r3"]

# Correlate D3DDevice_Resolve destinations with the later VdSwap source. These
# observers copy only the six fetch dwords and preserve both guest operations.

# The default-off passive trace brackets only the statically accepted producer
# path. Every hook returns to the original instruction stream.

[[midasm_hook]]
address = 0x8269C7A8
name = "TraceReservationEnter"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x8269C80C
name = "TraceReservationReturn"
registers = ["r3", "r29", "r31"]

[[midasm_hook]]
address = 0x826A4638
name = "TraceVdSwapOwnerEnter"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x826A4C0C
name = "TraceVdSwapOwnerReturn"
registers = ["r31"]

[[midasm_hook]]
address = 0x8269E520
name = "ObserveRendererResolve"
registers = ["r4", "r6", "r8", "r9", "lr"]

[[midasm_hook]]
address = 0x8269F360
name = "TraceResolveReturn"

[[midasm_hook]]
address = 0x826A4884
name = "ObserveRendererSwapSource"
registers = ["r3", "r4", "r30", "r31"]

[[midasm_hook]]
address = 0x826AE5B8
name = "ObserveNativeGuestVertexSelection"
registers = ["r30", "r31", "r15", "r19"]

[[midasm_hook]]
address = 0x826A3E18
name = "ObserveNativeGuestIndexedSubmission"
registers = ["r31", "r11", "r28", "r29", "r27", "r19"]

# Converted display gamma is live on the stack before the original setter
# compares and retains it. The alternate PWL layout is not a 256-entry table.
[[midasm_hook]]
address = 0x8268FE30
name = "ObserveNativeGuestGammaTable"
registers = ["r31", "r1"]

[[midasm_hook]]
address = 0x8268FEF8
name = "ObserveNativeGuestPwlGamma"
registers = ["r31"]

[[midasm_hook]]
address = 0x826A4888
name = "TraceVdSwapReturn"
registers = ["r3", "r30", "r31"]

[[midasm_hook]]
address = 0x826A4890
name = "TraceVdSwapPublished"
registers = ["r30", "r31"]

[[midasm_hook]]
address = 0x826A4150
name = "TracePreSwapEnter"

[[midasm_hook]]
address = 0x826A4324
name = "TracePreSwapReturn"

[[midasm_hook]]
address = 0x8269CD20
name = "TraceEmitterCd20Enter"

[[midasm_hook]]
address = 0x8269CE78
name = "TraceEmitterCd20Return"

[[midasm_hook]]
address = 0x8269BF40
name = "TraceEmitterBf40Enter"

[[midasm_hook]]
address = 0x8269C12C
name = "TraceEmitterBf40Return"

[[midasm_hook]]
address = 0x826A3FB8
name = "TraceCallbackEnter"

[[midasm_hook]]
address = 0x826A4148
name = "TraceCallbackReturn"

[[midasm_hook]]
address = 0x826ABEA8
name = "TraceOrdinaryCallerEnter"

[[midasm_hook]]
address = 0x826AC018
name = "TraceOrdinaryCallerReturn"

[[midasm_hook]]
address = 0x82517E38
name = "TraceAlternateCallerEnter"

[[midasm_hook]]
address = 0x82517EB4
name = "TraceAlternateCallerReturn"

# Retain a failed render config until the same renderer supplies valid caps.

[[midasm_hook]]
address = 0x82245050
name = "RememberGfxRenderConfig"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x82302E90
name = "HandleGfxRenderCapsBegin"
registers = ["r3", "r4", "lr"]

[[midasm_hook]]
address = 0x82302F0C
name = "HandleGfxRenderCapsEnd"
registers = ["r3", "r31"]

# Fast combat selects the guest's native 0.5 presentation divisor only after
# setup selected an observed native 2.0 or 1.5 divisor.
[[midasm_hook]]
address = 0x82D7F934
name = "ApplyCombatPaceOverride"

# Correct the active rush-cost divisor before the displayed and submitted cost
# returns, then coordinate the consumer before its production and treasury
# stores.

[[midasm_hook]]
address = 0x82CE2938
name = "FixRushCostDisplay"
registers = ["r27", "r30", "r31", "r6", "r7", "r11"]

[[midasm_hook]]
address = 0x82D17A9C
name = "FixRushCostApply"
registers = ["r25", "r26", "r28", "r3", "r6", "r8"]

# Compose Unique Unit base attack and defense before the native accessors apply
# their built-in unit and civilization modifiers.

[[midasm_hook]]
address = 0x82CF225C
name = "ApplyUniqueUnitBaseAttack"
registers = ["r28", "r29", "r27"]

[[midasm_hook]]
address = 0x82CF21D8
name = "ApplyUniqueUnitBaseDefense"
registers = ["r29", "r30", "r31"]

# Replace one unlocked UEA cell only in the shared cumulative lookup. Exact
# mode branches around this site and remains entirely native.

[[midasm_hook]]
address = 0x82CF0D6C
name = "ApplyUniqueEraAbilityCell"
registers = ["r4", "r9", "r11"]

# Replace the civilization information fields while their selectors remain
# live in the builder.

[[midasm_hook]]
address = 0x82D77F0C
name = "ApplyLeaderNameNationSelectText"
registers = ["r3", "r20"]

[[midasm_hook]]
address = 0x82D77FD0
name = "ApplyCivilizationNameNationSelectText"
registers = ["r3", "r20"]

[[midasm_hook]]
address = 0x82D7807C
name = "ApplyEraAbilityNationSelectText"
registers = ["r31", "r20"]

[[midasm_hook]]
address = 0x82D781AC
name = "ApplyCivilizationTraitNationSelectText"
registers = ["r30", "r20"]

[[midasm_hook]]
address = 0x82D78228
name = "ApplyUniqueUnitSectionHeadingNationSelectText"
registers = ["r3"]

# Replace each localized Special Units name before the builder joins names.

[[midasm_hook]]
address = 0x82D783B4
name = "ApplyUniqueUnitNationSelectText"
registers = ["r3", "r27", "r20"]

# Add identity-targeted movement deltas to the completed native result on the
# ordinary EffectiveUnitMovementLookup return. The special return bypasses
# this site and remains native.
[[midasm_hook]]
address = 0x82CF2198
name = "ApplyUnitMovementBase"
registers = ["r30", "r28", "r3"]

# Apply identity-targeted production cost percentages to the shared effective
# unit cost scalar after all native discounts have been composed.
[[midasm_hook]]
address = 0x82CF1268
name = "ApplyUnitProductionCostPercent"
registers = ["r30", "r29", "r28"]

# Apply creation-time Veteran and native special-upgrade grants for a matching
# runtime base type. The native +0x3C gate, UEA 50 route, increment, and
# saturation follow this site unchanged.
[[midasm_hook]]
address = 0x82D15B84
name = "ApplyUnitEffectCreationGrants"
registers = ["r26", "r28", "r30"]

# The native Mongolian village-capture effect hard-codes civilization 14 and
# bypasses the shared UEA lookup. Re-evaluate its Ancient cell at that exact
# gate so a replacement uses the native ordinary-village reward branch.

[[midasm_hook]]
address = 0x82D1B758
name = "ApplyBarbarianVillageCityReplacement"
registers = ["r10"]

# Retarget the unreachable retail UEA 57 technology-grant scaffold to the one
# title-owned synthetic ability. The surrounding native code retains selector
# 17 eligibility, cumulative lookup, ownership, and TechnologyAcquire behavior.

[[midasm_hook]]
address = 0x82D2127C
name = "BeginHorsebackRidingOwnershipCheck"
registers = ["r31"]

[[midasm_hook]]
address = 0x82D21280
name = "EndHorsebackRidingOwnershipCheck"
registers = ["r31"]

[[midasm_hook]]
address = 0x82D212A4
name = "SelectHorsebackRidingAbility"
registers = ["r3"]

[[midasm_hook]]
address = 0x82D212C0
name = "SelectHorsebackRidingTechnology"
registers = ["r4"]

# Reconcile only live same-player type-30 attachments after forced border
# relocation and the two verified successful post-combat movement returns.
# The repair changes only the General's tile coordinates.
[[midasm_hook]]
address = 0x82CBF534
name = "FixGreatGeneralBorderCompletion"

[[midasm_hook]]
address = 0x82CDFA64
name = "FixGreatGeneralPostCombat"
registers = ["r31", "r15"]

[[midasm_hook]]
address = 0x82CDFCC4
name = "FixGreatGeneralPostCombat"
registers = ["r31", "r26"]

# Compose the terrain component's base value before native civilization and
# tile modifiers continue from the original accessor branch.

[[midasm_hook]]
address = 0x82CF18B4
name = "ApplyTerrainTradeBase"
registers = ["r9", "r29"]

[[midasm_hook]]
address = 0x82CF1BAC
name = "ApplyTerrainProductionBase"
registers = ["r10", "r31"]

[[midasm_hook]]
address = 0x82CF1D9C
name = "ApplyTerrainFoodBase"
registers = ["r10", "r30"]

# Join identity-targeted Forest combat percentages immediately before native
# CombatResolve modifier calls; codegen preserves each displaced call.
[[midasm_hook]]
address = 0x82CDABBC
name = "ApplyUnitCombatAttackPercent"
registers = ["r1", "r16"]

[[midasm_hook]]
address = 0x82CDAC10
name = "ApplyUnitCombatDefensePercent"
registers = ["r1", "r17"]
