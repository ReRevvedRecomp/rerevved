# Publish the gameplay snapshot once per guest frame.
[[midasm_hook]]
address = 0x82C7DF58
name = "PublishGameplayState"

# Keep native selection of the largest city without a Temple for Ceremonial
# Burial, bypassing its impossible score > population gate.
[[midasm_hook]]
address = 0x82D0A158
name = "AdmitFirstDiscoveryTempleCity"
registers = ["r18"]
jump_address_on_true = 0x82D0A160

# Egypt's first free Irrigation keeps native first-discovery eligibility and
# reward/presentation phases while bypassing the general free-technology clear.
[[midasm_hook]]
address = 0x82D09588
name = "PreserveEgyptianIrrigationReward"
registers = ["r14", "r16", "r25", "r22"]
jump_address_on_true = 0x82D09594

# Skip kidnapping's destination writes and victim retirement when the native
# creator returns -1. Successful slots follow the native path.
[[midasm_hook]]
address = 0x82CF7090
name = "SkipFailedSpyUnitCreation"
registers = ["r3"]
jump_address_on_true = 0x82CF7360

# Skip bribery's destination writes and UI on creation failure, retaining its
# native statistics recount before the common tail.
[[midasm_hook]]
address = 0x82CF7274
name = "SkipFailedSpyUnitCreation"
registers = ["r3"]
jump_address_on_true = 0x82CF7354

# Literacy's native Courthouse match is a bug. Before the technology/building
# join branch, report no match for that one pair so the native loop advances
# to the next building without scoring or delivery.
[[midasm_hook]]
address = 0x82D09BD0
name = "SuppressLiteracyCourthouseReward"
registers = ["r9", "r18"]
jump_address_on_true = 0x82D0A2E4

# First-discovery phase 2 can read a city saved by an earlier discovery.
# This candidate fix skips only caption formatting when that city is invalid
# or no longer owned by the acquiring player.
[[midasm_hook]]
address = 0x82D0A254
name = "SuppressStaleFirstDiscoveryCaption"
registers = ["r15", "r16", "r29"]
jump_address_on_true = 0x82D0A280

# Fast combat selects the guest's native 0.5 presentation divisor only after
# setup selected an observed native 2.0 or 1.5 divisor.
[[midasm_hook]]
address = 0x82D7F934
name = "ApplyCombatPaceOverride"

# Correct the active divisor for rush cost before the displayed and submitted
# cost returns, then coordinate the consumer before its production and treasury
# stores.
[[midasm_hook]]
address = 0x82CE2938
name = "FixRushCostDisplay"
registers = ["r27", "r30", "r31", "r6", "r7", "r11"]

[[midasm_hook]]
address = 0x82D17A9C
name = "FixRushCostApply"
registers = ["r25", "r26", "r28", "r3", "r6", "r8"]

# Only reconcile live attachments of type 30 that belong to the same player. Do
# this after forced border relocation and the two verified successful returns
# from movement after combat. The repair changes only the General's tile
# coordinates.
[[midasm_hook]]
address = 0x82CBF534
name = "FixGreatGeneralBorderCompletion"

[[midasm_hook]]
address = 0x82CDFA64
name = "FixGreatGeneralPostCombat"
registers = ["r31", "r15"]

[[midasm_hook]]
address = 0x82CDFCC4
name = "FixGreatGeneralPostCombat"
registers = ["r31", "r26"]

# The research loop scores ordinals 0..N-1; ordinal N holds the -1 sentinel.
# The loop base moves from ordinal 1 to 0 and the trip count stays N.
# See rerevved-research manifests/science-completion.json and manifests/technology-prompt-callers.json.
[[midasm_hook]]
address = 0x82CED34C
name = "FixAiResearchScanStart"
registers = ["r10", "r11", "r18", "r26"]

# Admit every signed arrival year except -1, so BC and year-zero arrivals launch.
# Jumps past the native cmpwi/ble pair to the admitted arm at 0x82D2A08C; -1 still skips.
# See rerevved-research manifests/spaceship-launch-arrival-year-boundary.json.
[[midasm_hook]]
address = 0x82D2A084
name = "AdmitSpaceshipArrivalYear"
registers = ["r31"]
jump_address_on_true = 0x82D2A08C

# Domination palace-count arm: log the capital requirement per player. r27 is the
# player, r9 the owned count, r10 the scenario QUICKWIN value, r11 the required
# count (total original capitals minus r10). Registers are not modified.
[[midasm_hook]]
address = 0x82D11250
name = "LogDominationCapitals"
registers = ["r27", "r9", "r10", "r11"]

# Domination palace-count arm: rebase the elapsed turns for the native compare
# against 10 so domination_min_turns sets the minimum.
[[midasm_hook]]
address = 0x82D11264
name = "ApplyDominationMinimumTurns"
registers = ["r9"]
