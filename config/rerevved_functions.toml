# The maintained executable exposes direct-branch targets absent from its PDATA
# function-entry set. Keep inferred roots implicit; the truncated 0x82D77670
# routine uses the maintained next-entry boundary.

# The city UI label dispatch bounds and indexes its eight-entry table with r11.
# Keep that register explicit so code generation does not select the unrelated
# city-data offset held in r7.
[[switch_tables]]
address = 0x82DFF930
register = 11
labels = [
    0x82DFF954,
    0x82DFF960,
    0x82DFF96C,
    0x82DFF978,
    0x82DFF984,
    0x82DFF990,
    0x82DFF99C,
    0x82DFF9A8,
]

[functions."82D77670"]
end = 0x82D78648

