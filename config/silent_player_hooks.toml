# Read-only GT2 silent player log (src/silent_player_hooks.cpp); always on.

# sub_82A11B00, once a datagram matched a known connection and before framed and raw
# messages split; r11 is the connection.
[[midasm_hook]]
address = 0x82A11D04
name = "NotePlayerHeard"
registers = ["r11"]

# sub_82A148E8 entry: the per-connection think; r3 is the connection.
[[midasm_hook]]
address = 0x82A148E8
name = "CheckSilentPlayer"
registers = ["r3"]
