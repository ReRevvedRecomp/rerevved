name: Build

on:
  workflow_call:
    inputs:
      publish_mode:
        description: artifact or release
        required: true
        type: string
    secrets:
      ASSETS_TOKEN:
        required: true

permissions:
  contents: read

env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  EXPECTED_XEX_SIZE: '16822272'
  EXPECTED_XEXP_SIZE: '3291136'

jobs:
  build:
    name: Windows x64
    # The native renderer proves its byte accounting for one compiler and STL
    # pair; other toolchains build, but its draw stream fails closed.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out ReRevved
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Bundled mods must target a title commit in this history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Read mods lock
        id: mods-lock
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath rerevved-mods.lock.json -Raw | ConvertFrom-Json
          $match = [regex]::Match($lock.repository, '^https://github\.com/(?<repo>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$')
          if (-not $match.Success) { throw 'Invalid rerevved-mods lock repository' }
          if ($lock.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid rerevved-mods lock commit' }
          "repository=$($match.Groups['repo'].Value)" >> $env:GITHUB_OUTPUT
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT

      - name: Check out pinned mods
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.mods-lock.outputs.repository }}
          ref: ${{ steps.mods-lock.outputs.commit }}
          path: rerevved-mods-src

      - name: Assemble bundled mods
        shell: pwsh
        run: |
          python scripts/assemble_mods.py --mods-checkout rerevved-mods-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake ninja -y --no-progress
          # The pinned release has no Chocolatey package; unpack the official installer.
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.4-win64.exe'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22.1.4'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/LLVM-22.1.4-win64.exe' -OutFile $installer
          7z x $installer "-o$llvm" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $llvm 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Check toolchain
        shell: pwsh
        run: |
          $clang = (Get-Command clang++).Source
          $version = & $clang --version | Select-Object -First 1
          Write-Output "$clang`n$version`nVCToolsVersion=$env:VCToolsVersion"
          if ($version -notmatch '^clang version 22\.1\.4\b') { throw "Expected clang 22.1.4, found: $version" }
          if ($env:VCToolsVersion -notlike '14.44.*') { throw "Expected MSVC 14.44, found: $env:VCToolsVersion" }

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: windows-amd64

      - name: Read SDK lock
        id: sdk-lock
        shell: pwsh
        run: |
          $lock = Get-Content rexglue-sdk.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -ne 'https://github.com/ReRevvedRecomp/rerevved-sdk') {
            throw 'Unexpected SDK repository in rexglue-sdk.lock.json'
          }
          if ($lock.commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid SDK commit in rexglue-sdk.lock.json'
          }
          "commit=$($lock.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Clone pinned SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'rerevved-sdk'
          git clone --branch main --single-branch `
            https://github.com/ReRevvedRecomp/rerevved-sdk $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw 'SDK clone failed' }
          git -C $sdkRoot checkout --detach '${{ steps.sdk-lock.outputs.commit }}'
          if ($LASTEXITCODE -ne 0) { throw 'SDK checkout failed' }
          git -C $sdkRoot submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'SDK submodule init failed' }

      - name: Fetch upstream SDK release tags
        working-directory: ${{ runner.temp }}\rerevved-sdk
        shell: pwsh
        run: >-
          git fetch --force --no-tags
          https://github.com/rexglue/rexglue-sdk.git
          'refs/tags/v*:refs/tags/v*'

      - name: Restore SDK install
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\rerevved-sdk\out\install\win-amd64
          key: rexglue-sdk-windows-clang22.1.4-msvc14.44-${{ steps.sdk-lock.outputs.commit }}

      - name: Build and install SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}\rerevved-sdk
        shell: pwsh
        run: |
          cmake --preset win-amd64 `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/build/win-amd64 --config Release `
            --target install --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Owner-supplied inputs live only in the private assets repository.
      # Never echo their contents or a command that exposes them.
      - name: Fetch codegen input
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          if (-not $env:GH_TOKEN) {
            throw 'ASSETS_TOKEN secret is empty or missing'
          }
          if ($env:ASSETS_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Set ASSETS_REPO to owner/repository'
          }
          git lfs version
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS is unavailable' }
          $assetsRoot = Join-Path $env:RUNNER_TEMP 'rerevved-private-assets'
          git clone --quiet --depth 1 --branch main --single-branch `
            "https://github.com/$env:ASSETS_REPO" $assetsRoot
          if ($LASTEXITCODE -ne 0) { throw 'Private asset clone failed' }
          git -C $assetsRoot lfs pull `
            --include='game/default.xex,game/default.xexp' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Private asset LFS pull failed' }
          $gameRoot = Join-Path $PWD 'game'
          New-Item -ItemType Directory -Force -Path $gameRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $assetsRoot 'game\default.xex') `
            -Destination (Join-Path $gameRoot 'default.xex')
          Copy-Item -LiteralPath (Join-Path $assetsRoot 'game\default.xexp') `
            -Destination (Join-Path $gameRoot 'default.xexp')

      - name: Clean up private asset checkout
        if: always()
        shell: pwsh
        run: |
          $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $assetsRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $tempRoot 'rerevved-private-assets'))
          if ([System.IO.Path]::GetDirectoryName($assetsRoot) -ne
              $tempRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar)) {
            throw 'Refusing unsafe private asset cleanup'
          }
          if (Test-Path -LiteralPath $assetsRoot) {
            Remove-Item -LiteralPath $assetsRoot -Recurse -Force
          }

      - name: Validate codegen input
        shell: pwsh
        run: |
          $checks = @(
            @{ File = 'game\default.xex';  Size = $env:EXPECTED_XEX_SIZE },
            @{ File = 'game\default.xexp'; Size = $env:EXPECTED_XEXP_SIZE }
          )
          foreach ($check in $checks) {
            $asset = Get-Item -LiteralPath $check.File
            if ($asset.Length -ne [int64]$check.Size) {
              throw "Codegen input has the wrong size: $($check.File)"
            }
          }

      - name: Configure for codegen
        shell: pwsh
        run: |
          $sdkConfig = Join-Path $env:RUNNER_TEMP `
            'rerevved-sdk\out\install\win-amd64\lib\cmake\rexglue'
          cmake --preset win-amd64-release "-Drexglue_DIR=$sdkConfig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Objects compiled from retail-derived generated code must not enter a
          # shared compiler cache; only the SDK build uses sccache.
          python scripts/audit_compile_launchers.py --before-codegen out/build/win-amd64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate recompiled sources
        shell: pwsh
        run: |
          cmake --build --preset win-amd64-release --target rerevved_codegen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ReRevved
        shell: pwsh
        run: |
          $sdkConfig = Join-Path $env:RUNNER_TEMP `
            'rerevved-sdk\out\install\win-amd64\lib\cmake\rexglue'
          cmake --preset win-amd64-release "-Drexglue_DIR=$sdkConfig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_compile_launchers.py out/build/win-amd64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir out/build/win-amd64-release -C Release -j 2 --output-on-failure

      - name: Package archive
        shell: pwsh
        run: |
          python scripts/package.py --platform windows --arch x64 --mods-dir out/bundled-mods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate archive allowlist
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -Path out -Filter 'rerevved-v*-windows-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows x64 archive' }
          python scripts/check_package_inventory.py --platform windows $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: rerevved-windows-x64
          path: out/rerevved-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: ${{ inputs.publish_mode == 'release' && 1 || 14 }}

      # The developer configuration (REREVVED_DEVELOPER=ON) reuses the generated
      # sources above, so it configures and builds after the shipping build, never
      # beside it. Its build directory is never packaged.
      - name: Build developer configuration
        shell: pwsh
        run: |
          $sdkConfig = Join-Path $env:RUNNER_TEMP `
            'rerevved-sdk\out\install\win-amd64\lib\cmake\rexglue'
          cmake --preset win-amd64-developer "-Drexglue_DIR=$sdkConfig"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_compile_launchers.py out/build/win-amd64-developer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-developer --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run developer tests
        shell: pwsh
        run: ctest --test-dir out/build/win-amd64-developer -C Release -j 2 --output-on-failure

      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out ReRevved
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Bundled mods must target a title commit in this history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Read mods lock
        id: mods-lock
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath rerevved-mods.lock.json -Raw | ConvertFrom-Json
          $match = [regex]::Match($lock.repository, '^https://github\.com/(?<repo>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$')
          if (-not $match.Success) { throw 'Invalid rerevved-mods lock repository' }
          if ($lock.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid rerevved-mods lock commit' }
          "repository=$($match.Groups['repo'].Value)" >> $env:GITHUB_OUTPUT
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT

      - name: Check out pinned mods
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.mods-lock.outputs.repository }}
          ref: ${{ steps.mods-lock.outputs.commit }}
          path: rerevved-mods-src

      - name: Assemble bundled mods
        shell: pwsh
        run: |
          python scripts/assemble_mods.py --mods-checkout rerevved-mods-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install clang 22
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 220
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 220

      - name: Install Linux build dependencies
        shell: bash
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt update
          sudo apt install -y cmake ninja-build build-essential git curl unzip autoconf python3.12-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev vulkan-sdk \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Read SDK lock
        id: sdk-lock-linux
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          lock = json.loads(pathlib.Path("rexglue-sdk.lock.json").read_text(encoding="ascii"))
          if lock.get("repository") != "https://github.com/ReRevvedRecomp/rerevved-sdk":
              raise SystemExit("Unexpected SDK repository in rexglue-sdk.lock.json")
          commit = lock.get("commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("Invalid SDK commit in rexglue-sdk.lock.json")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as output:
              output.write(f"commit={commit}\n")
          PY

      - name: Clone pinned SDK
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/rerevved-sdk"
          git clone --branch main --single-branch \
            https://github.com/ReRevvedRecomp/rerevved-sdk "$sdk_root"
          git -C "$sdk_root" checkout --detach '${{ steps.sdk-lock-linux.outputs.commit }}'
          git -C "$sdk_root" submodule update --init --recursive --depth 1

      - name: Fetch upstream SDK release tags
        working-directory: ${{ runner.temp }}/rerevved-sdk
        shell: bash
        run: >-
          git fetch --force --no-tags
          https://github.com/rexglue/rexglue-sdk.git
          'refs/tags/v*:refs/tags/v*'

      - name: Restore SDK install
        id: sdk-cache-linux
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rerevved-sdk/out/install/linux-amd64
          key: rexglue-sdk-linux-${{ steps.sdk-lock-linux.outputs.commit }}

      - name: Build and install SDK
        if: steps.sdk-cache-linux.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/rerevved-sdk
        shell: bash
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake --preset linux-amd64 -DREXGLUE_BUILD_TESTS=OFF
          cmake --build out/build/linux-amd64 --config Release \
            --target install --parallel

      # Owner-supplied inputs live only in the private assets repository.
      # Never echo their contents or a command that exposes them.
      - name: Fetch codegen input
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          if (-not $env:GH_TOKEN) {
            throw 'ASSETS_TOKEN secret is empty or missing'
          }
          if ($env:ASSETS_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Set ASSETS_REPO to owner/repository'
          }
          git lfs version
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS is unavailable' }
          $assetsRoot = Join-Path $env:RUNNER_TEMP 'rerevved-private-assets'
          git clone --quiet --depth 1 --branch main --single-branch `
            "https://github.com/$env:ASSETS_REPO" $assetsRoot
          if ($LASTEXITCODE -ne 0) { throw 'Private asset clone failed' }
          git -C $assetsRoot lfs pull `
            --include='game/default.xex,game/default.xexp' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Private asset LFS pull failed' }
          $gameRoot = Join-Path $PWD 'game'
          New-Item -ItemType Directory -Force -Path $gameRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $assetsRoot 'game/default.xex') `
            -Destination (Join-Path $gameRoot 'default.xex')
          Copy-Item -LiteralPath (Join-Path $assetsRoot 'game/default.xexp') `
            -Destination (Join-Path $gameRoot 'default.xexp')

      - name: Clean up private asset checkout
        if: always()
        shell: pwsh
        run: |
          $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $assetsRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $tempRoot 'rerevved-private-assets'))
          if ([System.IO.Path]::GetDirectoryName($assetsRoot) -ne
              $tempRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar)) {
            throw 'Refusing unsafe private asset cleanup'
          }
          if (Test-Path -LiteralPath $assetsRoot) {
            Remove-Item -LiteralPath $assetsRoot -Recurse -Force
          }

      - name: Validate codegen input
        shell: pwsh
        run: |
          $checks = @(
            @{ File = 'game/default.xex';  Size = $env:EXPECTED_XEX_SIZE },
            @{ File = 'game/default.xexp'; Size = $env:EXPECTED_XEXP_SIZE }
          )
          foreach ($check in $checks) {
            $asset = Get-Item -LiteralPath $check.File
            if ($asset.Length -ne [int64]$check.Size) {
              throw "Codegen input has the wrong size: $($check.File)"
            }
          }

      - name: Configure for codegen
        shell: bash
        run: |
          sdk_config="$RUNNER_TEMP/rerevved-sdk/out/install/linux-amd64/lib/cmake/rexglue"
          cmake --preset linux-amd64-release "-Drexglue_DIR=$sdk_config"
          python scripts/audit_compile_launchers.py --before-codegen out/build/linux-amd64-release

      - name: Generate recompiled sources
        shell: bash
        run: cmake --build --preset linux-amd64-release --target rerevved_codegen

      - name: Build ReRevved
        shell: bash
        run: |
          sdk_config="$RUNNER_TEMP/rerevved-sdk/out/install/linux-amd64/lib/cmake/rexglue"
          cmake --preset linux-amd64-release "-Drexglue_DIR=$sdk_config"
          python scripts/audit_compile_launchers.py out/build/linux-amd64-release
          cmake --build --preset linux-amd64-release --parallel

      - name: Run tests
        run: ctest --test-dir out/build/linux-amd64-release -C Release -j 2 --output-on-failure

      - name: Package archive
        shell: bash
        run: python scripts/package.py --platform linux --arch x64 --mods-dir out/bundled-mods

      - name: Validate archive allowlist
        shell: bash
        run: |
          archives=(out/rerevved-v*-linux-x64.tar.gz)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo 'Expected exactly one Linux x64 archive' >&2
            exit 1
          fi
          python scripts/check_package_inventory.py --platform linux "${archives[0]}"

          extract_root="$(mktemp -d "$RUNNER_TEMP/rerevved-package.XXXXXX")"
          cleanup_extract() {
            if [[ "$extract_root" == "$RUNNER_TEMP"/rerevved-package.* ]]; then
              rm -rf -- "$extract_root"
            else
              echo 'Refusing unsafe package cleanup' >&2
              return 1
            fi
          }
          trap cleanup_extract EXIT

          archive_name="$(basename "${archives[0]}" .tar.gz)"
          tar -xzf "${archives[0]}" -C "$extract_root"
          package_root="$extract_root/$archive_name"

          if ! readelf -d "$package_root/rerevved" |
              grep -Eq "\\((RPATH|RUNPATH)\\).*\\\$ORIGIN"; then
            echo "Linux executable lacks an \$ORIGIN RPATH or RUNPATH" >&2
            exit 1
          fi

          runtime_line='^[[:space:]]*(librexruntime\.so|librexgpu-xenos\.so)[[:space:]]*=>[[:space:]]*([^[:space:]]+)'
          resolved_dependencies=0
          for binary in rerevved librexruntime.so librexgpu-xenos.so; do
            ldd_output="$(ldd "$package_root/$binary")"
            if grep -Fq 'not found' <<<"$ldd_output"; then
              echo "Linux archive dependency is missing for $binary" >&2
              exit 1
            fi
            while IFS= read -r line; do
              if [[ "$line" =~ $runtime_line ]]; then
                dependency="${BASH_REMATCH[1]}"
                resolved_path="${BASH_REMATCH[2]}"
                canonical_path="$(readlink -f "$resolved_path")"
                expected_path="$package_root/$dependency"
                if [[ "$canonical_path" != "$expected_path" ]]; then
                  echo 'ReXGlue dependency resolved outside the archive' >&2
                  exit 1
                fi
                ((resolved_dependencies += 1))
              fi
            done <<<"$ldd_output"
          done
          if ((resolved_dependencies == 0)); then
            echo 'No ReXGlue archive dependencies were resolved' >&2
            exit 1
          fi
          echo 'Linux archive linkage: PASS'

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: rerevved-linux-x64
          path: out/rerevved-v*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.publish_mode == 'release' && 1 || 14 }}

      # The developer configuration reuses the generated sources above, so it
      # builds after the shipping build, never beside it, and is never packaged.
      - name: Build developer configuration
        shell: bash
        run: |
          sdk_config="$RUNNER_TEMP/rerevved-sdk/out/install/linux-amd64/lib/cmake/rexglue"
          cmake --preset linux-amd64-developer "-Drexglue_DIR=$sdk_config"
          python scripts/audit_compile_launchers.py out/build/linux-amd64-developer
          cmake --build --preset linux-amd64-developer --parallel

      - name: Run developer tests
        run: ctest --test-dir out/build/linux-amd64-developer -C Release -j 2 --output-on-failure
