name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Source
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.release-tag.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Match tag to project version
        id: release-tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $project = Get-Content -LiteralPath CMakeLists.txt -Raw
          $match = [regex]::Match($project, '(?m)^project\(rerevved VERSION (?<version>\d+\.\d+\.\d+) ')
          if (-not $match.Success) { throw 'project version not found in CMakeLists.txt' }
          $version = $match.Groups['version'].Value
          $releaseTag = "v$version"
          if ($env:TAG -eq $releaseTag) {
            $prerelease = 'false'
          } elseif ($env:TAG.StartsWith("$releaseTag-") -and $env:TAG.Length -gt $releaseTag.Length + 1) {
            $prerelease = 'true'
          } else {
            throw "tag $env:TAG does not match project version $version; expected $releaseTag or $releaseTag-<suffix>"
          }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
      - name: Install formatting tool
        run: python -m pip install --disable-pip-version-check clang-format==22.1.8
      - name: Run repository checks
        shell: pwsh
        run: .\scripts\verify.ps1

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      publish_mode: release
    secrets:
      ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}

  release:
    name: Publish Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: rerevved-*-x64
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ReRevved ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
